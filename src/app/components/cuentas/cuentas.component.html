<div class="container py-4">

  <div class="listado-controls mb-4">
    <div class="input-group search-group">
      <input
        [(ngModel)]="searchTerm"
        (keyup)="search()"
        placeholder="Buscar usuario..."
        class="form-control"
      />
      <span class="input-group-text">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
          <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
        </svg>
      </span>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-md-6 col-lg-4" *ngFor="let cuenta of cuentasfiltrasdas">
      <div class="card cuenta-card h-100"
           [ngClass]="{ 'cuenta-aprobada': cuenta.data.aprobado, 'cuenta-rechazada': !cuenta.data.aprobado }">

        <!-- Status bar -->
        <div class="cuenta-status-bar"
             [ngClass]="{ 'bar-aprobado': cuenta.data.aprobado, 'bar-rechazado': !cuenta.data.aprobado }">
          <span>
            <i class="fas" [ngClass]="{ 'fa-check-circle': cuenta.data.aprobado, 'fa-times-circle': !cuenta.data.aprobado }"></i>
            {{ cuenta.data.aprobado ? 'Aprobado' : 'Rechazado' }}
          </span>
          <span class="estado-label">Estado de cuenta</span>
        </div>

        <div class="card-body">
          <div class="cuenta-avatar">
            <i class="fas fa-user-circle"></i>
          </div>
          <h5 class="card-title">{{ cuenta.data.email }}</h5>
          <p class="cuenta-nombre text-muted mb-3" *ngIf="cuenta.data.nombre">
            <i class="fas fa-id-card me-1"></i> {{ cuenta.data.nombre }}
          </p>

          <button
            class="btn btn-cambiar-estado w-100 mb-2"
            (click)="cambiarEstadoAprobacion(cuenta)"
            [disabled]="cargandoAprobacion === cuenta.id || eliminando === cuenta.id"
          >
            <span *ngIf="cargandoAprobacion === cuenta.id" class="spinner-border spinner-border-sm me-2" role="status"></span>
            <i *ngIf="cargandoAprobacion !== cuenta.id" class="fas me-2"
               [ngClass]="{ 'fa-toggle-on': cuenta.data.aprobado, 'fa-toggle-off': !cuenta.data.aprobado }"></i>
            {{ cargandoAprobacion === cuenta.id ? 'Guardando...' : (cuenta.data.aprobado ? 'Rechazar acceso' : 'Aprobar acceso') }}
          </button>

          <button
            class="btn btn-eliminar w-100"
            (click)="eliminarCuenta(cuenta)"
            [disabled]="eliminando === cuenta.id || cargandoAprobacion === cuenta.id"
          >
            <span *ngIf="eliminando === cuenta.id" class="spinner-border spinner-border-sm me-2" role="status"></span>
            <i *ngIf="eliminando !== cuenta.id" class="fas fa-trash me-2"></i>
            {{ eliminando === cuenta.id ? 'Eliminando...' : 'Eliminar cuenta' }}
          </button>
        </div>

      </div>
    </div>
  </div>

</div>
