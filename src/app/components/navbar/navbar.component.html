<nav class="navbar fixed-top navbar-expand-lg ph-navbar">
  <div class="container-fluid px-3 px-lg-4">

    <a class="navbar-brand" [routerLink]="logueado ? '/home/alta' : '/login'">
      <img src="../../../assets/logo.png" alt="Phoenix" loading="eager" class="ph-logo" />
    </a>

    <button class="navbar-toggler ph-toggler" type="button" (click)="buttonsNav.toggle()" aria-label="Menú">
      <i class="fas fa-bars"></i>
    </button>

    <div class="collapse navbar-collapse" mdbCollapse #buttonsNav="mdbCollapse">

      <!-- Logueado -->
      <ul class="navbar-nav ms-auto align-items-lg-center" *ngIf="logueado">

        <li class="nav-item">
          <a class="nav-link ph-link"
             [routerLink]="'/home/alta'"
             routerLinkActive="ph-active"
             [routerLinkActiveOptions]="{exact: true}">
            <i class="fas fa-plus"></i>
            <span>Nuevo trabajo</span>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link ph-link"
             [routerLink]="'/home/listado'"
             routerLinkActive="ph-active"
             [routerLinkActiveOptions]="{exact: true}">
            <i class="fas fa-briefcase"></i>
            <span>Trabajos</span>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link ph-link"
             [routerLink]="'/home/presupuestos'"
             routerLinkActive="ph-active">
            <i class="fas fa-file-invoice"></i>
            <span>Presupuestos</span>
          </a>
        </li>

        <li class="ph-vsep d-none d-lg-flex"></li>

        <!-- Clientes dropdown -->
        <li class="nav-item" mdbDropdown>
          <a class="nav-link ph-link" mdbDropdownToggle role="button">
            <i class="fas fa-users"></i>
            <span>Clientes</span>
            <i class="fas fa-chevron-down ph-caret"></i>
          </a>
          <ul mdbDropdownMenu class="dropdown-menu ph-dropdown">
            <li>
              <a class="dropdown-item ph-drop-item" [routerLink]="'/home/listadoC'">
                <i class="fas fa-list-ul"></i>
                Ver clientes
              </a>
            </li>
            <li>
              <a class="dropdown-item ph-drop-item" [routerLink]="'/home/altaC'">
                <i class="fas fa-user-plus"></i>
                Nuevo cliente
              </a>
            </li>
          </ul>
        </li>

        <!-- Admin dropdown -->
        <li class="nav-item" *ngIf="esAdmin" mdbDropdown>
          <a class="nav-link ph-link" mdbDropdownToggle role="button">
            <i class="fas fa-cog"></i>
            <span>Admin</span>
            <i class="fas fa-chevron-down ph-caret"></i>
          </a>
          <ul mdbDropdownMenu class="dropdown-menu ph-dropdown dropdown-menu-end">
            <li>
              <a class="dropdown-item ph-drop-item" [routerLink]="'/home/caja'">
                <i class="fas fa-cash-register"></i>
                Caja
              </a>
            </li>
            <li>
              <a class="dropdown-item ph-drop-item" [routerLink]="'/home/graficos'">
                <i class="fas fa-chart-bar"></i>
                Gráficos
              </a>
            </li>
            <li>
              <a class="dropdown-item ph-drop-item" [routerLink]="'/home/cuentas'">
                <i class="fas fa-university"></i>
                Cuentas
              </a>
            </li>
            <li>
              <a class="dropdown-item ph-drop-item" [routerLink]="'/home/tabla'">
                <i class="fas fa-table"></i>
                Tabla
              </a>
            </li>
            <li><hr class="dropdown-divider ph-drop-divider"></li>
            <li>
              <a class="dropdown-item ph-drop-item" [routerLink]="'/home/auditoria'">
                <i class="fas fa-clipboard-list"></i>
                Auditoría
              </a>
            </li>
          </ul>
        </li>

        <li class="ph-vsep d-none d-lg-flex"></li>

        <li class="nav-item">
          <button class="btn ph-btn-logout" (click)="logOut()">
            <i class="fas fa-sign-out-alt"></i>
            <span>Salir</span>
          </button>
        </li>
      </ul>

      <!-- No logueado -->
      <ul class="navbar-nav ms-auto align-items-lg-center gap-2" *ngIf="!logueado">
        <li class="nav-item">
          <a class="nav-link ph-link" [routerLink]="'/login'" routerLinkActive="ph-active">
            Iniciar sesión
          </a>
        </li>
        <li class="nav-item">
          <button class="btn ph-btn-register" (click)="goTo('register')">
            Registrarse
          </button>
        </li>
      </ul>

    </div>
  </div>
</nav>
